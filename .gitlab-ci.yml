stages:
  - eval

search-eval:
  stage: eval
  image: node:20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - lib/search/**/*
        - lib/ai/search-ai.ts
        - eval/search-golden.json
        - supabase/migrations/**/*
  script:
    - npm ci
    - npx tsx local/eval-search.ts --ci
  variables:
    NEXT_PUBLIC_SUPABASE_URL: $STAGING_SUPABASE_URL
    SUPABASE_SECRET_KEY: $STAGING_SUPABASE_KEY
    OPENAI_API_KEY: $OPENAI_API_KEY
